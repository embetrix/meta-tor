header:
  version: 14
machine: "qemux86-64"
distro: nodistro
target:
  - tor-demo-image
repos:
  # It's current revision will be used to perform the build.
  meta-tor:
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    branch: wrynose
    path: "layers/openembedded-core"
    layers:
      meta:
  bitbake:
    url: https://github.com/openembedded/bitbake.git
    branch: "2.18"
    path: "layers/bitbake"
    layers:
      bitbake: disabled
  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: wrynose
    path: "layers/meta-openembedded"
    layers:
      meta-oe:
      meta-networking:
      meta-perl:
      meta-python:
      meta-multimedia:
      meta-filesystems:
      meta-webserver:
  meta-raspberrypi:
    url: "https://git.yoctoproject.org/git/meta-raspberrypi.git"
    branch: wrynose
    path: "layers/meta-raspberrypi"
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    INHERIT += "rm_work"
    EXTRA_IMAGE_FEATURES += "allow-empty-password empty-root-password allow-root-login"
  license_flags: |
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
