# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "tor"
BBFILE_PATTERN_tor := "^${LAYERDIR}/"
BBFILE_PRIORITY_tor = "6"
LAYERSERIES_COMPAT_tor = "scarthgap"
LAYERDEPENDS_tor = "core openembedded-layer"
